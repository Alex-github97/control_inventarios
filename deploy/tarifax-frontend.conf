# El portal del dominio de TarifaX.
#
# Sirve exactamente el mismo paquete que el portal de Icoltrans —la misma
# imagen, los mismos archivos— y lo reescribe al vuelo para este dominio: le
# inyecta el guion que abre la sesión y le cambia la marca. La aplicación no se
# toca; lo que cambia es lo que se le entrega al navegador acá.
#
# Va en un archivo aparte con `server_name` propio: nginx escoge por nombre
# antes que por `default_server`, así que este bloque atiende el dominio de
# TarifaX y el resto sigue cayendo donde caía.

# ── La revisión de lo servido ─────────────────────────────────────────────
#
# El paquete se entrega bajo un prefijo con número de revisión. Los archivos
# son los mismos; lo que cambia es la dirección.
#
# Hace falta porque acá el contenido se reescribe al servir, mientras que el
# nombre del archivo —con su hash— lo fijó la compilación y no cambia. Un
# navegador que ya guardó la versión anterior la tiene marcada como `immutable`
# por un año: no vuelve a pedirla ni al recargar, y sigue mostrando la marca
# vieja. Cambiar la dirección es lo único que lo obliga a pedirla de nuevo.
#
# Al cambiar la marca o el guion, se sube este número.
map $host $revision {
    default "r2";
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La respuesta se reescribe al vuelo, y `sub_filter` no sabe leer contenido
    # comprimido: si se sirviera precomprimido, la reescritura se perdería en
    # silencio y la marca volvería a aparecer sin que nada lo avisara.
    gzip off;
    gunzip on;

    # ── La marca de este dominio ──────────────────────────────────────────
    #
    # La identidad del producto está en un objeto literal del paquete, y ahí se
    # reemplaza. Se apunta a cada campo con su nombre delante —`nombre:"…"`,
    # `sigla:"…"`— y no a la palabra suelta: `sub_filter` compara sin distinguir
    # mayúsculas, y una sigla de dos letras suelta aparecería en mil sitios del
    # paquete donde no significa nada.
    #
    # Reescribir el paquete y no el código fuente es lo que permite que el
    # portal de Icoltrans siga con su marca: es el mismo archivo, servido
    # distinto según por dónde se pida.
    sub_filter_types text/html application/javascript;
    sub_filter_once off;

    sub_filter 'nombre:"TittanWare"'      'nombre:"TarifaX"';
    sub_filter 'logotipo:"TITTANWARE"'    'logotipo:"TARIFAX"';
    sub_filter 'corto:"TITTANWARE"'       'corto:"TARIFAX"';
    sub_filter 'sigla:"TW"'               'sigla:"TX"';
    sub_filter 'lema:"Tecnología que fortalece · Soluciones que trascienden"'
               'lema:"Motor de tarifas y costeo de fletes"';
    sub_filter ' TittanWare · Todos los derechos reservados'
               ' TarifaX · Todos los derechos reservados';

    # Y la marca del documento: pestaña del navegador y descripción.
    sub_filter '<title>TittanWare</title>' '<title>TarifaX</title>';
    sub_filter 'content="TittanWare — Tecnología que fortalece, soluciones que trascienden"'
               'content="TarifaX — Motor de tarifas y costeo de fletes"';

    # El paquete se pide bajo el prefijo de revisión. Los fragmentos que carga
    # la aplicación sobre la marcha se resuelven relativos al módulo que los
    # importa, así que quedan bajo el mismo prefijo sin tener que nombrarlos.
    sub_filter 'src="/assets/'  'src="/$revision/assets/';
    sub_filter 'href="/assets/' 'href="/$revision/assets/';

    # El guion que abre la sesión de este dominio.
    sub_filter '</head>' '<script src="/__entrada-tarifax.js"></script></head>';

    location = /__entrada-tarifax.js {
        alias /etc/nginx/entrada-tarifax.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # El ícono de la pestaña, propio de este dominio.
    location = /favicon.svg {
        alias /etc/nginx/favicon-tarifax.svg;
        default_type image/svg+xml;
        add_header Cache-Control "no-store";
    }

    # Qué fragmentos existen. El guion los lee para adelantarse a cargarlos y
    # que al cambiar de pantalla no aparezca la pantalla de carga. Se consulta
    # en vez de escribirlos a mano porque sus nombres llevan un hash que cambia
    # en cada compilación.
    # Con barra final: nginx redirige un directorio sin ella, y la redirección
    # devolvía HTML donde el guion esperaba JSON.
    location = /__fragmentos/ {
        alias /usr/share/nginx/html/assets/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }

    # El paquete, bajo su prefijo de revisión.
    location ~ ^/r\d+/assets/(.*)$ {
        alias /usr/share/nginx/html/assets/$1;
        # Un mes y no un año, y sin `immutable`: acá el contenido se reescribe
        # al servir, así que prometer que nunca cambia sería falso. Es lo que
        # dejó a los navegadores con la marca vieja pegada.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # La aplicación resuelve sus rutas en el navegador: cualquier dirección que
    # no sea un archivo real devuelve index.html, o recargar en /tarifax/motor
    # daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
