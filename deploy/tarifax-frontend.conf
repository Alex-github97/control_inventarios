# El portal del dominio de pruebas de TarifaX.
#
# Sirve exactamente el mismo paquete que el portal de Icoltrans —la misma
# imagen, los mismos archivos— y le agrega una sola cosa al vuelo: el guion que
# abre la sesión de pruebas. La aplicación no se toca; lo que cambia es lo que
# se le entrega al navegador en ESTE dominio.
#
# Va en un archivo aparte con `server_name` propio: nginx escoge por nombre
# antes que por `default_server`, así que este bloque atiende el dominio de
# pruebas y el resto sigue cayendo donde caía.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La respuesta se reescribe al vuelo, y `sub_filter` no sabe leer contenido
    # comprimido: si el archivo se sirviera precomprimido, la inyección se
    # perdería en silencio.
    gzip off;
    gunzip on;

    sub_filter_once on;
    sub_filter '</head>' '<script src="/__entrada-tarifax.js"></script></head>';

    location = /__entrada-tarifax.js {
        alias /etc/nginx/entrada-tarifax.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # La aplicación resuelve sus rutas en el navegador: cualquier dirección que
    # no sea un archivo real devuelve index.html, o recargar en /tarifax/motor
    # daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre no cambian nunca; index.html sí, y por
    # eso no se cachea: si se cacheara, un despliegue nuevo no se vería.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
