# Cada push a main se valida y, con la aprobación de un responsable, se
# despliega en el servidor de producción.
#
# 1. validar: compila el frontend (con su revisión de tipos) y el backend.
#    Corre solo, en segundos o pocos minutos.
# 2. desplegar: queda EN ESPERA hasta que un revisor del entorno «produccion»
#    lo apruebe en GitHub (llega aviso por correo y en la app). Si se rechaza o
#    nadie lo aprueba en 30 días, no se despliega nada.
#
# El entorno se configura en Settings → Environments → produccion:
#   - Required reviewers: quién aprueba.
#   - Secretos del entorno (solo se entregan después de aprobar):
#       SERVIDOR_HOST    la IP estática del servidor
#       SERVIDOR_USUARIO el usuario de despliegue (deploy)
#       SERVIDOR_LLAVE   la llave privada de ese usuario
#       SERVIDOR_HUELLA  la línea de known_hosts del servidor (evita suplantación)
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez; si llegan varios pushes seguidos, no se cancela el
# que va a medias (dejaría el servidor entre dos versiones).
concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # En la misma imagen que compila en el servidor (node:20-alpine): el
      # package-lock trae el empaquetador para Alpine (musl) y no el de Ubuntu,
      # así que compilar directo en el runner falla aunque el código esté bien.
      - name: Frontend (tipos y compilación)
        run: |
          docker run --rm -v "$PWD/frontend:/app" -w /app node:20-alpine \
            sh -c "npm ci --no-audit --no-fund && npm run build"

      - name: Backend (sintaxis)
        run: python3 -m compileall -q backend/app

  desplegar:
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: produccion
    steps:
      # La llave puede venir de dos formas: el texto de siempre
      # (-----BEGIN OPENSSH PRIVATE KEY-----…) o en una sola línea en base64,
      # que es lo más seguro de copiar desde la terminal del navegador de
      # Lightsail (esa terminal mete saltos y espacios que dañan la llave).
      - name: Llave y huella del servidor
        env:
          LLAVE: ${{ secrets.SERVIDOR_LLAVE }}
          HUELLA: ${{ secrets.SERVIDOR_HUELLA }}
        run: |
          install -m 700 -d ~/.ssh
          limpia="$(printf '%s' "$LLAVE" | tr -d '\r')"
          if printf '%s' "$limpia" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            printf '%s\n' "$limpia" | sed 's/[[:space:]]*$//' | grep -v '^$' > ~/.ssh/despliegue
          else
            printf '%s' "$limpia" | tr -d ' \n\t' | base64 -d > ~/.ssh/despliegue
          fi
          chmod 600 ~/.ssh/despliegue
          if ! ssh-keygen -y -f ~/.ssh/despliegue > /dev/null 2>&1; then
            echo "::error::El secreto SERVIDOR_LLAVE no es una llave válida. Vuelva a copiarla (ver deploy/ASISTENTE_REUNIONES.md o docs/TAREAS_PENDIENTES.md)."
            exit 1
          fi
          printf '%s\n' "$HUELLA" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Actualizar el servidor
        run: |
          ssh -i ~/.ssh/despliegue -o StrictHostKeyChecking=yes \
            "${{ secrets.SERVIDOR_USUARIO }}@${{ secrets.SERVIDOR_HOST }}" \
            /opt/tittanware/deploy/actualizar.sh
