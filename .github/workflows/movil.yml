# Construye, firma y publica el APK de la app móvil del CMMS.
#
# Se dispara con una etiqueta movil-vX.Y.Z (TittanWare) o lite-vX.Y.Z
# (TittanLite) —la versión debe coincidir con movil/app.json— o a mano desde
# Actions eligiendo la app. Necesita, además de los secretos del
# despliegue, dos del repositorio:
#   MOVIL_FIRMA_JKS   la llave movil/firma/tittanware.jks en base64 (una línea)
#   MOVIL_FIRMA_CLAVE el contenido de movil/firma/clave.txt
# El APK no queda público: va directo al servidor por la llave de despliegue
# (deploy/actualizar.sh lo recibe con el pedido «publicar-apk») y desde ahí lo
# descarga solo quien tiene sesión y el CMMS contratado.
name: App móvil

on:
  push:
    tags: ['movil-v*', 'lite-v*']
  workflow_dispatch:
    inputs:
      app:
        description: 'Qué app publicar'
        type: choice
        options: [cmms, lite]
        default: cmms

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: produccion
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('movil/app.json'))['expo']['version'])")
          CODIGO=$(python3 -c "import json;print(json.load(open('movil/app.json'))['expo']['android']['versionCode'])")
          APP="${{ github.event.inputs.app || 'cmms' }}"
          [[ "$GITHUB_REF" == refs/tags/lite-v* ]] && APP=lite
          ETIQUETA="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" == refs/tags/* && "${ETIQUETA#*-v}" != "$VERSION" ]]; then
            echo "::error::La etiqueta $ETIQUETA no coincide con la versión $VERSION de movil/app.json"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "nombre=$([ "$APP" = lite ] && echo TittanLite || echo TittanWare)" >> "$GITHUB_OUTPUT"
          echo "extra=$([ "$APP" = lite ] && echo ' lite' || true)" >> "$GITHUB_OUTPUT"

      - name: Llave de firma
        env:
          JKS: ${{ secrets.MOVIL_FIRMA_JKS }}
          CLAVE: ${{ secrets.MOVIL_FIRMA_CLAVE }}
        run: |
          [ -n "$JKS" ] && [ -n "$CLAVE" ] || { echo "::error::Faltan los secretos MOVIL_FIRMA_JKS y MOVIL_FIRMA_CLAVE"; exit 1; }
          mkdir -p movil/firma
          printf '%s' "$JKS" | tr -d ' \n\r\t' | base64 -d > movil/firma/tittanware.jks
          printf '%s' "$CLAVE" | tr -d '\r\n' > movil/firma/clave.txt

      - name: Compilar y firmar
        env:
          APP_VARIANT: ${{ steps.version.outputs.app == 'lite' && 'lite' || '' }}
        run: |
          # Base del compilador: espejo de Google y, si falla, Docker Hub; con
          # reintentos, porque una descarga cortada no debe tumbar la publicación.
          BASE=""
          for intento in 1 2 3; do
            for origen in mirror.gcr.io/library/eclipse-temurin:17-jdk-jammy eclipse-temurin:17-jdk-jammy; do
              if docker pull -q "$origen"; then BASE="$origen"; break 2; fi
            done
            echo "No se pudo bajar la imagen base (intento $intento); reintentando…"; sleep 20
          done
          [ -n "$BASE" ] || { echo "::error::No se pudo descargar la imagen base del compilador"; exit 1; }
          for intento in 1 2 3; do
            docker build --build-arg BASE="$BASE" -t tw-android movil/compilar && break
            [ "$intento" = 3 ] && exit 1
            echo "Falló la construcción del compilador (intento $intento); reintentando…"; sleep 20
          done
          docker volume create ci_movil_nm >/dev/null
          bash movil/compilar/apk.sh

      - name: Llave y huella del servidor
        env:
          LLAVE: ${{ secrets.SERVIDOR_LLAVE }}
          HUELLA: ${{ secrets.SERVIDOR_HUELLA }}
        run: |
          install -m 700 -d ~/.ssh
          limpia="$(printf '%s' "$LLAVE" | tr -d '\r')"
          if printf '%s' "$limpia" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            printf '%s\n' "$limpia" | sed 's/[[:space:]]*$//' | grep -v '^$' > ~/.ssh/despliegue
          else
            printf '%s' "$limpia" | tr -d ' \n\t' | base64 -d > ~/.ssh/despliegue
          fi
          chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$HUELLA" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Publicar en el servidor
        run: |
          ssh -i ~/.ssh/despliegue -o StrictHostKeyChecking=yes \
            "${{ secrets.SERVIDOR_USUARIO }}@${{ secrets.SERVIDOR_HOST }}" \
            "publicar-apk ${{ steps.version.outputs.version }} ${{ steps.version.outputs.codigo }}${{ steps.version.outputs.extra }}" \
            < "movil/compilar/salida/${{ steps.version.outputs.nombre }}-${{ steps.version.outputs.version }}.apk"
          curl -fsS "https://app.tittanware.com/api/v1/movil/version?app=${{ steps.version.outputs.app }}"
