# Sirve el frontend ya compilado. El Dockerfile lo copia en su etapa de
# producción; sin este archivo, esa etapa fallaba al construir.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La aplicación resuelve sus rutas en el navegador: cualquier ruta que no
    # sea un archivo real devuelve index.html, o recargar en /eam/neumaticos
    # daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre no cambian nunca; index.html sí, y por
    # eso no se cachea: si se cacheara, un despliegue nuevo no llegaría al
    # navegador hasta que el usuario limpiara su caché.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
