# Sirve el frontend ya compilado. El Dockerfile lo copia en su etapa de
# producción; sin este archivo, esa etapa fallaba al construir.
#
# Hay dos aplicaciones distintas, compiladas por separado, y se reparten por
# host: el portal de los clientes y la consola del operador. El proxy de entrada
# reenvía la cabecera Host, que es lo que permite decidir acá.

# ─── Página pública ───────────────────────────────────────────────────────────
# Va primero: los nombres más específicos deben ganarle al bloque por defecto.
server {
    listen 80;
    # El dominio comercial y una dirección de vista previa que ya apunta a la
    # VPS, para poder revisarla antes de mover el DNS del .com.
    server_name tittanware.com www.tittanware.com www.tittanware.tech;
    root /usr/share/nginx/html-landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx resuelve el nombre del backend al cargar la configuración; con la
    # dirección en una variable y el resolver de Docker la vuelve a resolver, y
    # un redespliegue del backend no deja la página sin contenido.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # El contenido editable se pide al backend desde el mismo origen: así no
    # hace falta CORS ni exponer la API en otro dominio.
    location /api/ {
        set $destino_landing backend:8000;
        proxy_pass http://$destino_landing;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html no se cachea: si se cacheara, un cambio publicado desde la
    # consola no llegaría hasta que el visitante limpie su navegador.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ─── Consola del operador ─────────────────────────────────────────────────────
# Va primero para que gane sobre el bloque por defecto.
server {
    listen 80;
    # Los dos nombres: el subdominio real es `administrador`, y se deja
    # `admin` porque es el que se suele teclear por costumbre.
    server_name administrador.* admin.*;
    root /usr/share/nginx/html-admin;
    index admin.html;

    # La consola no debe indexarse ni poder incrustarse en otra página.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /admin.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /admin.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ─── Portal de los clientes ───────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La aplicación resuelve sus rutas en el navegador: cualquier ruta que no
    # sea un archivo real devuelve index.html, o recargar en /eam/neumaticos
    # daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre no cambian nunca; index.html sí, y por
    # eso no se cachea: si se cacheara, un despliegue nuevo no llegaría al
    # navegador hasta que el usuario limpiara su caché.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
